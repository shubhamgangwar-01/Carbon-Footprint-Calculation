# docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conference_carbon
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U carbon"], interval: 5s, retries: 10 }
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://carbon:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/conference_carbon
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: http://localhost:8080
      ENABLE_ONLINE_GEOCODING: ${ENABLE_ONLINE_GEOCODING:-false}
      AUTO_MIGRATE: "true"
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  frontend:
    build: { context: frontend }
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
